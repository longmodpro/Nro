
name: Get Unity Activation File

on:
  workflow_dispatch:

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Generate activation request
        id: request
        uses: game-ci/unity-activate@v2
        with:
          unityVersion: 2021.3.16f1
      - name: Upload activation request
        uses: actions/upload-artifact@v4
        with:
          name: Unity-Activation
          path: "*.alf"
          
