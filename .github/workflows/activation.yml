name: Unity License Check

on:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Check license secret exists
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
        run: |
          if [ -z "$UNITY_LICENSE" ]; then
            echo "UNITY_LICENSE is missing."
            echo "A valid Unity license is required."
            exit 1
          fi
          echo "UNITY_LICENSE secret exists."
