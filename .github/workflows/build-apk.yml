name: Build NRO Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'Client/Source_Unity/**'
      - '.github/workflows/build-apk.yml'

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Client/Source_Unity/Library
          key: Unity-Library-Android-${{ hashFiles('Client/Source_Unity/Assets/**', 'Client/Source_Unity/Packages/**', 'Client/Source_Unity/ProjectSettings/**') }}
          restore-keys: |
            Unity-Library-Android-

      - name: Build Android APK
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath: Client/Source_Unity
          unityVersion: 2021.3.16f1
          targetPlatform: Android
          buildsPath: build
          buildName: NRO-Private
          androidExportType: androidPackage

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NRO-Android-APK
          path: build/**/*.apk
          if-no-files-found: error
          retention-days: 14
